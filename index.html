<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lorenzza — Centro de Estética</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="loading-screen" class="overlay">
    <div class="loader"></div>
    <p id="loading-msg">Iniciando Lorenzza...</p>
  </div>

  <div id="login-screen" class="overlay hidden">
    <div class="login-box">
      <h1 class="brand-romantic">Lorenzza</h1>
      <p class="subtitle">Configuración de Base de Datos</p>
      <input type="password" id="cfg-key" placeholder="API Key de Firebase"/>
      <input type="text" id="cfg-auth" placeholder="Auth Domain"/>
      <input type="text" id="cfg-db" placeholder="Database URL"/>
      <input type="text" id="cfg-pid" placeholder="Project ID"/>
      <button class="btn btn-primary full-width" onclick="saveConfig()">Entrar al Sistema</button>
    </div>
  </div>

  <aside id="sidebar" style="display:none">
    <div class="logo-container">
      <h1 class="brand-romantic">Lorenzza</h1>
      <small class="tagline">CENTRO DE ESTÉTICA</small>
    </div>
    <nav>
      <a class="nav-item active" onclick="showView('dash')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Panel Principal
      </a>
      <a class="nav-item" onclick="showView('clients')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Clientes
      </a>
      <a class="nav-item" onclick="showView('shifts')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Turnos
      </a>
    </nav>
    <div class="sidebar-footer">
       <button class="btn btn-logout" onclick="logout()">Cerrar Sesión</button>
    </div>
  </aside>

  <main id="main-content" style="display:none">
    <header>
      <h2 id="view-title">Bienvenido</h2>
    </header>

    <div id="v-dash" class="view">
      <div class="stats-grid">
        <div class="card stat jade">
          <span>Balance Mensual</span>
          <b id="dash-balance">$0</b>
        </div>
        <div class="card stat sky">
          <span>Turnos Hoy</span>
          <b id="dash-shifts">0</b>
        </div>
        <div class="card stat">
          <span>Clientes Totales</span>
          <b id="dash-clients">0</b>
        </div>
      </div>
      
      <div class="dashboard-tables">
        <div class="card">
          <h3>Últimas Ventas</h3>
          <div id="dash-sales"></div>
        </div>
        <div class="card">
          <h3>Gastos Recientes</h3>
          <div id="dash-expenses"></div>
        </div>
      </div>
    </div>

    <div id="v-clients" class="view hidden"></div>
    </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  
  <script>
    /* Lógica de Firebase integrada */
    let db, cache = { clients:[], shifts:[], sales:[], expenses:[] };
    const g = id => document.getElementById(id);
    const esc = t => String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
    const fmt$ = n => new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'}).format(n||0);

    function initFirebase(cfg){
      try {
        const app = firebase.initializeApp(cfg);
        db = app.database();
        loadAll();
      } catch(e) { alert("Error al conectar"); logout(); }
    }

    function loadAll(){
      db.ref('/').on('value', snap => {
        const data = snap.val() || {};
        cache.clients = Object.entries(data.clients||{}).map(([id,v])=>({id,...v}));
        cache.shifts = Object.entries(data.shifts||{}).map(([id,v])=>({id,...v}));
        cache.sales = Object.entries(data.sales||{}).map(([id,v])=>({id,...v}));
        cache.expenses = Object.entries(data.expenses||{}).map(([id,v])=>({id,...v}));
        
        g('loading-screen').style.display='none';
        g('sidebar').style.display='flex';
        g('main-content').style.display='block';
        renderDash();
      });
    }

    function showView(v){
      document.querySelectorAll('.view').forEach(x => x.classList.add('hidden'));
      document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
      g('v-'+v).classList.remove('hidden');
      if(v==='clients') renderClients();
    }

    function renderDash(){
      g('dash-clients').textContent = cache.clients.length;
      const totalSales = cache.sales.reduce((a,b)=>a+(b.total||0),0);
      const totalExp = cache.expenses.reduce((a,b)=>a+(b.amount||0),0);
      g('dash-balance').textContent = fmt$(totalSales - totalExp);
    }

    function renderClients(){
      g('v-clients').innerHTML = `
        <div class="card">
          <div style="display:flex; justify-content:space-between; margin-bottom:20px">
            <h3>Listado de Clientes</h3>
            <button class="btn btn-primary">+ Agregar</button>
          </div>
          <table>
            <thead><tr><th>Nombre</th><th>Teléfono</th></tr></thead>
            <tbody>
              ${cache.clients.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }

    function saveConfig(){
      const c = { 
        apiKey: g('cfg-key').value, 
        authDomain: g('cfg-auth').value, 
        databaseURL: g('cfg-db').value, 
        projectId: g('cfg-pid').value 
      };
      localStorage.setItem('lor_cfg', JSON.stringify(c));
      location.reload();
    }

    function logout(){ localStorage.removeItem('lor_cfg'); location.reload(); }

    const saved = localStorage.getItem('lor_cfg');
    if(saved) initFirebase(JSON.parse(saved));
    else { g('loading-screen').style.display='none'; g('login-screen').classList.add('show'); }
  </script>
</body>
</html>
